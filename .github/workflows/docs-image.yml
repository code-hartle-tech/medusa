name: build + push docs image to GHCR

on:
  push:
    branches: [develop]
    paths:
      - 'docs/**'
      - 'wiki/**'
      - '.github/workflows/docs-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `internal` is deliberately absent. That variant is the tailnet-only
        # wiki/ realm, which the public mirror does not carry and must not —
        # so it cannot be built here, and listing it would only produce a
        # permanently red job. It is built from Forgejo, where wiki/ exists.
        variant: [external, landing]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          REPO_LC="${GITHUB_REPOSITORY,,}"
          BASE="${REGISTRY}/${REPO_LC}-docs-${{ matrix.variant }}"
          echo "primary=${BASE}:sha-${{ github.run_number }}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "moving=${BASE}:develop"  >> "$GITHUB_OUTPUT"

      - name: Build + push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          # Repository root: the internal variant's source is the top-level
          # wiki/ realm, which a docs-only context cannot reach.
          context: .
          file: ./docs/Dockerfile
          platforms: linux/amd64
          build-args: |
            VARIANT=${{ matrix.variant }}
          push: true
          tags: |
            ${{ steps.tags.outputs.primary }}
            ${{ steps.tags.outputs.moving }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
