[platformio]
default_envs = esp32s3-idf44
src_dir = main

[env]
framework = espidf
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
build_flags =
    -Wall
    -Wextra
    -Werror=return-type

[env:esp32s3-idf44]
platform = espressif32 @ 5.4.0
board = esp32-s3-devkitc-1

[env:esp32-idf44]
platform = espressif32 @ 5.4.0
board = esp32dev

; Current comparison lane. ESP-IDF 6.0.1 requires substantially larger GCC 15
; packages than the IDF 4.4 archaeology lane, so it is not a default download.
[env:esp32s3-idf60]
platform = espressif32 @ 7.0.1
board = esp32-s3-devkitc-1
